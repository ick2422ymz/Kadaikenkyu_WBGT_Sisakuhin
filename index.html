<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBGT 計測器 (PDF風)</title>
    <!-- デジタル時計風のフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    </head>

<body>
    <div class="device-container">
        
        <div class="page-number">[Page 1]</div>

        <header class="device-header">
            <h1>WBGT計</h1>
        </header>

        <div class="device-body">
            <!-- 左側：入力パネル -->
            <div class="input-panel">
                
                <!-- 温度コントロール -->
                <div class="control-group">
                    <label>温度 <span id="temp-display" class="digital-text">25.0</span> 度</label>
                    <div class="button-group">
                        <button onclick="changeTemp(-10)">10度↓</button>
                        <button onclick="changeTemp(-1)">1度↓</button>
                        <button onclick="changeTemp(-0.1)">0.1度↓</button>
                        <button onclick="changeTemp(0.1)">0.1度↑</button>
                        <button onclick="changeTemp(1)">1度↑</button>
                        <button onclick="changeTemp(10)">10度↑</button>
                    </div>
                </div>

                <!-- 湿度コントロール -->
                <div class="control-group">
                    <label>湿度 <span id="hum-display" class="digital-text">50.0</span> %</label>
                    <div class="button-group">
                        <button onclick="changeHum(-10)">10%↓</button>
                        <button onclick="changeHum(-1)">1%↓</button>
                        <button onclick="changeHum(-0.1)">0.1%↓</button>
                        <button onclick="changeHum(0.1)">0.1%↑</button>
                        <button onclick="changeHum(1)">1%↑</button>
                        <button onclick="changeHum(10)">10%↑</button>
                    </div>
                </div>
            </div>

            <!-- 右側：出力パネル -->
            <div class="output-panel">
                
                <div class="display-screen">
                    <div class="display-label">WBGT値</div>
                    <div id="wbgt-display" class="digital-text large-display">--.-</div>
                    <div class="unit">○○度</div>
                </div>

                <div class="alert-system">
                    <div id="status-text" class="status-message">慢心せずに暑さに気をつけて</div>
                    
                    <div class="led-array">
                        <div id="led-green" class="led green"></div>
                        <div id="led-yellow" class="led yellow"></div>
                        <div id="led-red" class="led red"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
